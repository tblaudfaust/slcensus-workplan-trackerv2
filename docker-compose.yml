services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-census_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-census_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-census_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-census_user}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-census_tracker}
    depends_on:
      db:
        condition: service_healthy
    # Not published directly to the host -- only Caddy accepts public
    # traffic (on 80/443) and proxies to this container over the internal
    # compose network. Uncomment `ports` below only for troubleshooting
    # (e.g. to hit http://<vps-ip>:8000 directly, bypassing Caddy/TLS).
    expose:
      - "8000"
    # ports:
    #   - "8000:8000"
    volumes:
      - media_data:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-stats-project.statistics.sl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
