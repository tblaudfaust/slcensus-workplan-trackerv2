# Render Blueprint -- lets Render provision the web service, database, and
# scheduled jobs together from this one file (New + > Blueprint, point it at
# this repo) instead of clicking through each piece by hand.
#
# Secrets are intentionally left blank here (sync: false) -- Render will
# prompt for them once during setup and store them securely; they are never
# committed to this file or the repo. See README.md "Deploying to Render"
# for the full walkthrough and the complete environment variable reference.

databases:
  - name: census-workplan-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: census-workplan-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: census-workplan-db
          property: connectionString
      - key: TIME_ZONE
        value: "Africa/Freetown"
      - key: SCHEDULER_ENABLED
        value: "False" # the free web service sleeps when idle; the Cron Jobs below handle scheduling instead
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_NAME
        value: "Census Project Workplan Tracker"
      - key: SITE_URL
        sync: false # set once you know the assigned onrender.com URL (or custom domain)
      - key: REMINDER_DAYS
        value: "1,3,7,14"
      - key: WORKSTREAM_OVERDUE_THRESHOLD
        value: "3"
      - key: SECURE_SSL_REDIRECT
        value: "True"

  - type: cron
    name: census-check-deadlines
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: "python manage.py check_deadlines"
    schedule: "0 7 * * *" # 07:00 UTC daily -- adjust for your timezone offset
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: census-workplan-db
          property: connectionString
      - key: SECRET_KEY
        sync: false # same value as the web service's SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: TIME_ZONE
        value: "Africa/Freetown"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_NAME
        value: "Census Project Workplan Tracker"
      - key: SITE_URL
        sync: false

  - type: cron
    name: census-weekly-digest
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: "python manage.py send_weekly_digest"
    schedule: "30 7 * * 1" # 07:30 UTC every Monday
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: census-workplan-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: TIME_ZONE
        value: "Africa/Freetown"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_NAME
        value: "Census Project Workplan Tracker"
      - key: SITE_URL
        sync: false
