{% extends "base.html" %}
{% block title %}Access denied — {{ block.super }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="section-card text-center py-5">
      <i class="bi bi-shield-lock" style="font-size:2.5rem;color:var(--ct-red);"></i>
      <h4 class="mt-3 mb-2">Access denied</h4>
      <p class="text-muted">You don't have permission to view this page. If you think this is a mistake, ask an administrator to check your account's role.</p>
      <a href="{% url 'dashboard:home' %}" class="btn btn-primary mt-2">Back to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
