{% extends "base.html" %}
{% block title %}Sign in — {{ block.super }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="section-card mt-5">
      <div class="text-center mb-4">
        <i class="bi bi-clipboard2-data" style="font-size:2.5rem;color:var(--ct-navy);"></i>
        <h4 class="mt-2 mb-0">Census Workplan Tracker</h4>
        <p class="text-muted small">Statistics Sierra Leone</p>
      </div>
      {% if form.errors %}
        <div class="alert alert-danger">Incorrect username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
