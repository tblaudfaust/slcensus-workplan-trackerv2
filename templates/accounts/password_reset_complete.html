{% extends "base.html" %}
{% load static %}
{% block title %}Reset password — {{ block.super }}{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="row justify-content-center w-100">
    <div class="col-md-5 col-lg-4">
      <div class="section-card login-card">
        <div class="text-center">
          <img src="{% static 'img/census_logo.jpeg' %}" alt="2026 Census logo" class="login-logo">
          <h4 class="mt-3 mb-2">Password updated</h4>
          <p class="text-muted small">Your password has been changed. You can now sign in with your new password.</p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 mt-2">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
