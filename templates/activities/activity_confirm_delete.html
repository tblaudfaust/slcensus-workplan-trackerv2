{% extends "base.html" %}
{% block title %}Delete activity — {{ block.super }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="section-card">
      <h4 class="mb-3">Delete "{{ activity.name }}"?</h4>
      <p class="text-muted">This permanently removes the activity and its comment/history records. This cannot be undone.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'activities:detail' activity.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
