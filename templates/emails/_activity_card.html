<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f9fb;border-radius:6px;margin:16px 0;">
  <tr><td style="padding:16px;">
    <div style="font-weight:bold;font-size:15px;margin-bottom:6px;">{{ activity.name }}</div>
    <div style="font-size:13px;color:#4a5568;">Workstream: {{ activity.workstream.name }}</div>
    <div style="font-size:13px;color:#4a5568;">End date: {{ activity.end_date|date:"d M Y"|default:"—" }}</div>
    <div style="font-size:13px;color:#4a5568;">Status: {{ activity.get_status_display }}</div>
    <div style="font-size:13px;color:#4a5568;">Progress: {{ activity.progress_percent }}%</div>
    <a href="{{ site_url }}{% url 'activities:detail' activity.pk %}" style="display:inline-block;margin-top:12px;padding:8px 16px;background:#1c7ed6;color:#ffffff;text-decoration:none;border-radius:4px;font-size:13px;">View activity</a>
  </td></tr>
</table>
