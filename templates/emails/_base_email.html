<html>

    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background:#1955a8;color:#ffffff;padding:20px 28px;font-size:18px;font-weight:bold;">
              {{ site_name }}
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#eaf2fd;color:#6b7785;font-size:12px;">
              This is an automated message from the {{ site_name }}. To stop receiving these emails, ask an administrator to update your notification preferences.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
